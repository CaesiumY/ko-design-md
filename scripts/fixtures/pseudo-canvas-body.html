<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      text over a negative-z wash of a body whose background is the canvas's
    </title>
    <!--
      Synthetic, written for scripts/audit-contrast-oracle.ts (#692). See
      scripts/fixtures/README.md: the expectation is derived from this CSS by
      hand, so a change here changes the derivation in the oracle too.

      The root has no background, so `body`'s white passes on to the canvas
      and `body` paints none on its own box. Its `::before` is a 60% black
      wash at `z-index: -1`, fixed over the viewport: `body` is no stacking
      context, so the wash is in the root's negative layer — over the
      canvas, under the text. On screen the black run sits on rgb(102),
      3.66, a fail. The hit test returns `body` with its computed white, and
      read as under that white the wash would be dropped and the run read as
      a pass at 21. A body whose background is the canvas's holds it.

      A document of its own: the propagation is a property of the whole
      document, so it cannot share one with the other pseudo-element panels.
    -->
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: oklch(1 0 0);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: oklch(0 0 0 / 0.6);
      }
      .t {
        margin: 0;
        color: oklch(0 0 0);
        font: 400 16px / 1.5 sans-serif;
      }
    </style>
  </head>
  <body>
    <p class="t">Sample text</p>
  </body>
</html>
