<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>text beside and under a painted pseudo-element</title>
    <!--
      Synthetic, written for scripts/audit-contrast-oracle.ts (#691). See
      scripts/fixtures/README.md: the expectations are derived from this CSS by
      hand, so a change here changes the derivation in the oracle too.

      Every panel is 300x120 — over 1% of the 976x800 viewport, so none
      is measured as a non-text surface — and white, with one run of black
      16px text centred in each but `.surface` and `.field`, described last.
      All but `.far` are `position: relative`. A
      16px line at line-height 1.5 is 24px tall, y 48..72 of the panel, and
      the box the collector reads for it is the text's own rect — the font's
      content area, about 18px tall for 16px sans-serif, centred on y 60 —
      so roughly y 51..69, and inside y 48..72 whatever the font. "Sample
      text" is well under 150px wide in any sans-serif, so the box lies inside
      x 60..240, centred on x 150; in `.grid`, whose run is centred in a 150px
      column, inside that column, x 150..300. `.vertical`'s run stands
      upright instead, a column about 18px wide centred on x 150 — inside
      x 60..240 still — and taller than the 24px line, well under the
      panel's 120px: the y range above is not its.

      - `.side::after` is a 60x24 black block level with the line, from x 0 to
        x 60. Its box misses the line's box, so it is not in the way.
        `left: 0; right: 100px; width: 60px` over-constrains it on purpose:
        `right` is what gives way, and a box built from it would sit at
        x 140..200, over the line. Only a box built from `left` misses it.
      - `.cover::before` fills the panel with a 10% black wash, which covers
        the line box whole. The run in it is `position: relative`, later in
        tree order than the wash, both with `z-index` auto, so it paints over
        the wash (#692): the wash is composed under the run, over the white
        panel. 10% black reads back from the canvas at alpha 26/255
        (0.1 x 255 = 25.5, rounded), turning white into rgb(229), luminance
        0.7835: black on it is (0.7835 + 0.05) / 0.05 = 16.67, a pass.
      - `.far` is a third panel of the same shape that is NOT positioned, put
        1000px further down behind a spacer, so the collector has to scroll to
        reach it. `html` is `position: relative`, which makes the document root
        its wash's containing block. The panel starts at y 24 + 144 + 144 +
        1000 = 1312 and x 24 of the root, and `.far::before` is placed exactly
        there at 300x120, so it covers the panel's line and the run reads
        16.67, as `.cover`'s does. The root's rect already moves with the
        scroll; subtracting the root's `scrollTop` again lifts the box clear
        of the line and reads it as 21. Its run is `position: relative` for
        the reason `.cover`'s is.
      - `.mark::before` is a highlighter under the lower part of the line, a
        10% black band from y 62 to y 76 across the panel. It misses the line's
        centre (y 60) but overlaps its rect by several pixels (down to about
        y 69), so the glyphs' lower part sits on it and it holds. A test of
        the centre alone would read it as a pass. It comes after `.far`, so
        `.far` keeps its place.
      - `.grid` is a grid of two 150px columns with its run placed in the
        second, x 150..300, so the run's box lies inside that column.
        `.grid::before` is placed in that column too (`grid-column: 2`) with
        `left: 0; width: 150px` — offsets from the grid area, not from the
        panel — so it covers the run and holds. Read from the panel's padding
        box instead, the same values put it at x 0..150, clear of the run, and
        the run would read as a pass. Its run is `position: relative` for the
        reason `.cover`'s is.
      - `.rtl` is written right to left (`direction: rtl`). `.rtl::before` is
        a 10% black wash over-constrained as `left: -150px; right: 0;
        width: 150px`. In a right-to-left containing block it is `left` that
        gives way (CSS 2, 10.3.7), so the wash sits at x 150..300 and covers
        the right half of the run, centred on x 150; a writing direction other
        than left-to-right horizontal holds the reading. Built from `left`,
        the box would be x -150..0, clear of the run, and the run would read
        as a pass. Its run is `position: relative` for the reason `.cover`'s
        is.
      - `.vertical` is written top to bottom, lines stacked right to left
        (`writing-mode: vertical-rl`), with the same wash as `.rtl`. The
        horizontal axis is now the block axis and its end is the left, so
        `left` gives way here too and the wash sits at x 150..300. The run
        stands as a column about 18px wide centred on x 150, so the wash
        covers its right half; a writing mode other than horizontal holds
        the reading. Built from `left`, the box would be x -150..0, clear of
        the column, and the run would read as a pass. Its run is
        `position: relative` for the reason `.cover`'s is.
      - `.surface` and `.field` carry the `.mark` test to the other two kinds
        of reading, whose area is the box of the element read rather than a
        text line. Their `::before` is a 10% black band from y 66 to y 90
        across the panel.
        - `.surface` holds no text but a 40x40 black box centred in it,
          y 40..80 — 1600px², under the non-text cut of 1% of the viewport
          (7808px²), so it is measured as a non-text surface. The band misses
          its centre (y 60) but overlaps its box from y 66 to y 80, so it
          holds. A test of the centre alone would read the white panel
          behind it, a pass at 21.
        - `.field` holds an `<input>` whose value is the run, 200x32 and
          centred, y 44..76, with no background or border, so the layers
          behind its text go on to the panel and its band. The band misses
          the input's centre (y 60) but overlaps its box from y 66 to y 76,
          so it holds. A test of the centre alone would read a pass at 21.
        Both the box and the input are `position: relative` for the reason
        `.cover`'s run is.
      - `.reflect::before` is a 10% black wash over the top of the panel,
        y 0..40, clear of the line (y 51..69). It carries
        `-webkit-box-reflect: below 0`, which paints a copy of it at y 40..80,
        over the line, so it holds. Read from its box alone it would miss the
        line and read as a pass. Its run is `position: relative` for the
        reason `.cover`'s is.

      The panels below are #692's own: which side of the text a
      pseudo-element covering the whole line box paints on, and what that
      does to the colours.

      - `.disc` is socar's calendar date: a 120px circle of oklch(0.6 0 0)
        (rgb(128), luminance 0.2159) centred by `top: 50%; left: 50%;
        transform: translate(-50%, -50%)` at `z-index: 0`, under a run that
        is `position: relative; z-index: 1`. The circle is x 90..210,
        y 0..120, and the line box's corners lie well inside it ("Sample
        text" is under 100px wide: corners at most about 50 x 9 from the
        centre, inside the 60px radius). The run reads black on rgb(128):
        (0.2159 + 0.05) / 0.05 = 5.32, a pass. Missed, it would read 21; laid
        over the text, it would hide it.
      - `.veil` puts a 60% black wash (`::after`, `inset: 0`) over a run in
        normal flow, so the wash paints over it. Black stays black under it,
        and the white panel turns rgb(102) (0.6 x 255 = 153 exactly):
        luminance 0.1329, so (0.1329 + 0.05) / 0.05 = 3.66, a fail. The wash
        takes pointer events, so the hit test puts the panel in front of the
        run — the shape that read as an `overlay` before #692 — and the run
        carries no reason at all.
      - `.opaque` is `.veil` with an opaque wash, which hides the text: held.
      - `.unknown` is `.veil` whose run carries `will-change: transform`,
        which may or may not make it a stacking context — the order is not
        read, so the run is held. Its wash takes no pointer events, so the
        hold is `pseudo-background` alone.
      - `.under` is a panel that is no stacking context, whose `::before`
        is opaque black at `z-index: -1`. That paints under the panel's own
        white background, out of sight, and the run is a pass at 21.
      - `.split` raises its run (`position: relative`) over a 50% black
        `::before`, as `.disc` does, but with an unpositioned wrapper of
        oklch(0.6 0 0) (rgb(128)) in between. The wash paints over the
        wrapper and under the run, so the hit test returns the panel twice:
        first where its wash is, then its own white background. Read as the
        panel's white, the wash would make it rgb(128) and the run a pass at
        5.32; on screen it is the wash over the wrapper, rgb(64), and a fail.
        The panel hit again holds it.
      - `.unhit` is `.split` with `pointer-events: none` on the wrapper (and
        `auto` back on the run), so the hit test skips the wrapper and may
        show the panel once. A painted element between the read element and
        the owner that takes no pointer events holds it.
      - `.spill` lays the same 50% wash, centred, from a 0px-tall white
        owner whose raised run spills out below it, over a panel of
        oklch(0.6 0 0). The owner is hit only where its wash is, and that
        place carries its white: read as white, the run would pass at 5.32;
        on screen the wash is over rgb(128), rgb(64), a fail. An owner whose
        own box does not hold the line holds it.
    -->
    <style>
      html {
        position: relative;
      }
      body {
        margin: 0;
        padding: 24px;
        background: oklch(1 0 0);
      }
      .side,
      .cover,
      .far,
      .mark,
      .grid,
      .rtl,
      .vertical,
      .surface,
      .field,
      .reflect,
      .disc,
      .veil,
      .opaque,
      .unknown,
      .under,
      .split,
      .unhit,
      .spill {
        position: relative;
        width: 300px;
        height: 120px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(1 0 0);
      }
      .side::after {
        content: "";
        position: absolute;
        left: 0;
        right: 100px;
        width: 60px;
        top: 48px;
        height: 24px;
        background: oklch(0 0 0);
      }
      .cover::before {
        content: "";
        position: absolute;
        inset: 0;
        background: oklch(0 0 0 / 0.1);
      }
      .cover .t,
      .far .t,
      .mark .t,
      .grid .t,
      .rtl .t,
      .vertical .t,
      .reflect .t {
        position: relative;
      }
      .far {
        position: static;
      }
      .far::before {
        content: "";
        position: absolute;
        left: 24px;
        top: 1312px;
        width: 300px;
        height: 120px;
        background: oklch(0 0 0 / 0.1);
      }
      .grid {
        display: grid;
        grid-template-columns: 150px 150px;
        align-items: center;
        justify-items: center;
      }
      .grid .t {
        grid-column: 2;
      }
      .grid::before {
        content: "";
        position: absolute;
        grid-column: 2;
        left: 0;
        top: 0;
        width: 150px;
        height: 120px;
        background: oklch(0 0 0 / 0.1);
      }
      .mark::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 62px;
        height: 14px;
        background: oklch(0 0 0 / 0.1);
      }
      .rtl {
        direction: rtl;
      }
      .vertical {
        writing-mode: vertical-rl;
      }
      .rtl::before,
      .vertical::before {
        content: "";
        position: absolute;
        left: -150px;
        right: 0;
        width: 150px;
        top: 0;
        height: 120px;
        background: oklch(0 0 0 / 0.1);
      }
      .surface::before,
      .field::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 66px;
        height: 24px;
        background: oklch(0 0 0 / 0.1);
      }
      .reflect::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 300px;
        height: 40px;
        background: oklch(0 0 0 / 0.1);
        -webkit-box-reflect: below 0;
      }
      .disc::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px;
        height: 120px;
        transform: translate(-50%, -50%);
        border-radius: 9999px;
        background: oklch(0.6 0 0);
        z-index: 0;
      }
      .disc .t {
        position: relative;
        z-index: 1;
      }
      .veil::after,
      .opaque::after,
      .unknown::after {
        content: "";
        position: absolute;
        inset: 0;
        background: oklch(0 0 0 / 0.6);
      }
      .opaque::after {
        background: oklch(0 0 0);
      }
      .unknown::after {
        pointer-events: none;
      }
      .unknown .t {
        will-change: transform;
      }
      .under::before {
        content: "";
        position: absolute;
        inset: 0;
        background: oklch(0 0 0);
        z-index: -1;
      }
      .split::before,
      .unhit::before {
        content: "";
        position: absolute;
        inset: 0;
        background: oklch(0 0 0 / 0.5);
      }
      .split .m,
      .unhit .m {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: oklch(0.6 0 0);
      }
      .split .t,
      .unhit .t {
        position: relative;
      }
      .unhit .m {
        pointer-events: none;
      }
      .unhit .t {
        pointer-events: auto;
      }
      .spill {
        background: oklch(0.6 0 0);
      }
      .spill .o {
        position: relative;
        width: 300px;
        height: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        background: oklch(1 0 0);
      }
      .spill .o::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -60px;
        height: 120px;
        background: oklch(0 0 0 / 0.5);
      }
      .spill .t {
        position: relative;
      }
      .box {
        position: relative;
        width: 40px;
        height: 40px;
        background: oklch(0 0 0);
      }
      .entry {
        position: relative;
        width: 200px;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        color: oklch(0 0 0);
        font: 400 16px / 1.5 sans-serif;
      }
      .spacer {
        height: 1000px;
      }
      .t {
        color: oklch(0 0 0);
        font: 400 16px / 1.5 sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="side"><span class="t">Sample text</span></div>
    <div class="cover"><span class="t">Sample text</span></div>
    <div class="spacer"></div>
    <div class="far"><span class="t">Sample text</span></div>
    <div class="mark"><span class="t">Sample text</span></div>
    <div class="grid"><span class="t">Sample text</span></div>
    <div class="rtl"><span class="t">Sample text</span></div>
    <div class="vertical"><span class="t">Sample text</span></div>
    <div class="surface"><span class="box"></span></div>
    <div class="field">
      <input class="entry" value="Sample text" aria-label="Sample" />
    </div>
    <div class="reflect"><span class="t">Sample text</span></div>
    <div class="disc"><span class="t">Sample text</span></div>
    <div class="veil"><span class="t">Sample text</span></div>
    <div class="opaque"><span class="t">Sample text</span></div>
    <div class="unknown"><span class="t">Sample text</span></div>
    <div class="under"><span class="t">Sample text</span></div>
    <div class="split">
      <div class="m"><span class="t">Sample text</span></div>
    </div>
    <div class="unhit">
      <div class="m"><span class="t">Sample text</span></div>
    </div>
    <div class="spill">
      <div class="o"><span class="t">Sample text</span></div>
    </div>
  </body>
</html>
