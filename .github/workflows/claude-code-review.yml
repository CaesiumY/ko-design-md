name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 새 커밋이 푸시되면 진행 중이던 이전 리뷰는 취소 (중복 비용 방지)
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # 메인테이너 브랜치의 내부 PR만 리뷰.
    # 포크·dependabot PR은 시크릿이 격리 컨텍스트로 전달되지 않아(GITHUB_TOKEN read-only 강등) 인증 실패하므로 스킵(조건 false → 잡 미생성). 드래프트도 스킵.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # gh pr comment로 리뷰 코멘트 게시 (App 토큰 미가용 시 GITHUB_TOKEN 폴백 대비)
      issues: write # PR 대화 코멘트는 issue 코멘트 API를 사용
      id-token: write # claude-code-action이 GitHub App 토큰 교환에 OIDC 사용 (필수)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 게시 검증(아래 Verify 스텝)의 기준 시각. 이 시각 이후 생성된
      # 마커 코멘트가 없으면 리뷰가 무음 실패한 것 (#157).
      - name: Capture start time
        id: start
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 블로그(CaesiumY.github.io)에서 검증된 자연어 단일 에이전트 리뷰 방식.
          # 플러그인(멀티에이전트)은 헤드리스에서 서브에이전트 도구가 막혀 코멘트까지 도달 못 함
          # → 자연어 프롬프트 + gh 도구로 교체. 단일 에이전트라 Task 상속 문제 없음.
          # 관점 체크리스트 대신 "보장을 깨는 입력을 찾아 확인된 것만" 을 시킨다. PR #331
          # 6d3f77e 를 정답지로 실측하니 체크리스트는 빈 섹션·칭찬으로 분량을 채우고 우회
          # 경로를 0/4 로 놓쳤고, 같은 Sonnet 에 이 형식을 주자 잡음 없이 1/4 를 잡았다.
          # 모델은 Sonnet 을 유지한다 — 깊은 로직 결함은 로컬 xhigh 리뷰와 Codex 가 맡는다.
          prompt: |
            이 풀 리퀘스트에서 머지 전에 고쳐야 할 결함을 찾아 한국어로 보고하세요.
            변경분은 `gh pr diff`, PR 설명과 이전 코멘트는 `gh pr view --comments` 로 보고,
            주변 코드는 저장소 파일을 직접 읽으세요. 레포의 CLAUDE.md 가 이 프로젝트의 정책·관례입니다.

            찾는 법:
            - 변경이 무엇을 보장하려는지(검사·게이트·불변식·정책)부터 한 문장으로 정하세요.
            - 그 보장을 깨는 구체적 입력을 만들어 보세요. 검증기·파서라면 "통과해선 안 되는데
              통과하는 입력"과 "막혀선 안 되는데 막히는 입력"을 둘 다 찾으세요. 실제 파서·런타임
              (브라우저 DOM, YAML 등)과 이 코드의 판정이 갈라지는 지점이 주된 후보입니다.
            - 각 후보는 코드를 줄 단위로 따라가 실제로 그렇게 동작하는지 확인한 뒤에만 보고하세요.
              확인하지 못한 추측은 버리세요.
            - 코드와 주석·문서·프롬프트·테스트 사이의 불일치도 결함입니다.
            - `services/*.md`·프리뷰·스킬을 건드리면 CLAUDE.md 의 카탈로그/design.md 정책 위반도
              결함으로 봅니다.
            - 이전 `## Claude Code Review` 코멘트가 있으면 읽고, 그 판정과 달라지면 무엇이
              바뀌었는지 밝히세요.

            게시:
            - 리뷰는 `gh pr comment` (Bash 도구)로 PR 에 코멘트로 남기세요. 최종 텍스트로만
              출력하고 게시를 생략하면 안 됩니다. 결함이 없어도 반드시 게시하세요.
            - 코멘트 본문의 첫 줄은 반드시 `## Claude Code Review` 헤딩입니다 — 후속 검증 스텝이
              이 마커로 게시 여부를 확인합니다. 그 앞에 작업 메모를 붙이지 마세요.
            - 결함은 심각도 순으로 번호를 매기고, 각 항목에 `파일:줄`, 재현 입력 또는 상황,
              잘못된 결과, 고치는 방향, 그리고 `[차단]` 또는 `[비차단]` 표시를 적으세요.
              차단은 머지하면 잘못된 동작·게이트나 검사의 우회·CLAUDE.md 정책 위반이 main 에
              들어가는 결함이고, 표현·구조·취향 제안은 비차단입니다. 판단이 서지 않으면 차단으로
              두세요 — 이 판정을 근거로 머지하므로 틀린다면 차단 쪽으로 틀려야 합니다.
            - 칭찬·총평·"해당 없음" 섹션(성능/보안 등)은 쓰지 마세요. 결함이 없으면 헤딩 아래에
              "이상 없음 — 확인한 보장: …" 을 쓰세요.
            - 마지막 줄은 결함이 있든 없든 `머지 판단: 차단 결함 없음` 또는
              `머지 판단: 차단 결함 N건` 이고, N 은 `[차단]` 항목 수와 같아야 합니다.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # 리뷰 에이전트가 "성공"으로 끝나고도 코멘트를 안 남기는 무음 실패(#157)를
      # 잡는다: 잡 시작 이후 생성된, 마커 헤딩으로 시작하는 코멘트가 1개 이상인지
      # 확인. 개수 전후 비교 대신 시각+마커 필터를 쓰는 이유 — 동시 코멘트 레이스와
      # 액션 진행 코멘트로 인한 위양성 회피.
      - name: Verify review comment was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          # 액션이 Claude를 실행조차 안 한 경우(대표: 이 워크플로우 파일을 수정하는
          # PR에서 액션의 워크플로우 검증이 스스로 스킵 — 머지 후 정상 동작)는
          # 무음 미게시가 아니므로 경고만 남기고 통과. execution_file은 실행 시에만
          # 설정되는 공식 output이라 실행 여부의 결정론적 신호다.
          if [ -z "$EXECUTION_FILE" ]; then
            echo "::warning::claude-code-action did not execute (workflow-validation skip on a PR editing this workflow, or output rename) — skipping comment verification."
            exit 0
          fi
          # --paginate: 이 엔드포인트는 오래된 순 정렬이라 코멘트가 100개를 넘는
          # 장수 PR에서는 방금 게시된 리뷰가 1페이지 밖으로 밀려 오경보가 난다.
          # 주의: gh의 --slurp는 --jq와 병용 불가(PR #169 실측 — 명령이 에러나
          # n이 빈 값 → 위양성 실패). --jq는 페이지마다 카운트를 한 줄씩 내므로
          # awk로 합산한다.
          n=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments?per_page=100" \
                --jq "[.[] | select(.created_at >= \"${{ steps.start.outputs.ts }}\")
                           | select(.body | startswith(\"## Claude Code Review\"))] | length" \
              | awk '{s+=$1} END {print s+0}')
          echo "review comments posted since job start: $n"
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::Claude review ran but did not post its review comment (silent failure — re-trigger with @claude or re-run this job)."
            exit 1
          fi
