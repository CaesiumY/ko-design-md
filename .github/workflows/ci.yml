name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check:last-updated diffs against the merge base; a depth-1 clone
          # has no base to diff against.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 이 Node 20 을 지원 범위에서 뺐다
          # (engines: ^22.22.2 || ^24.15.0 || >=26.0.0). jsdom 은 테스트 6개 파일의
          # vitest environment 이자 preview-validator-corpus 테스트가 직접 import 하므로
          # Node 20 을 유지하면 테스트가 지원 밖 런타임에서 돈다.
          #
          # engine-strict 를 켜 두지 않아 pnpm 은 불일치를 경고만 하고 설치는 성공시킨다
          # — 즉 버전을 안 맞추면 조용히 어긋난 채로 돌아간다.
          #
          # 버전 자체는 .nvmrc 에서 읽는다. 여기에 숫자를 직접 적으면 로컬(.nvmrc)과
          # CI 가 각자 하드코딩된 값을 갖게 되어, 한쪽만 올렸을 때 이 설정이 막으려던
          # 로컬↔CI 간극이 그대로 재생산된다.
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # validate:catalog is a strict superset of the citation-only
      # validate:sources gate (frontmatter round-trip, section order,
      # OKLCH-only token values, citations). validate:sources stays available
      # as a focused local command.
      - name: Validate catalog entries
        run: pnpm validate:catalog

      - name: Validate previews
        run: pnpm validate:previews

      - name: Check last_updated freshness
        # PR: the merge base. push: the commit this push replaced — main has no
        # branch protection, so a direct push is possible, and `origin/main`
        # equals HEAD there, which would make the gate a silent no-op.
        #
        # Via `env:` rather than interpolated into `run:`. Neither value can
        # hold shell metacharacters, but static scanners flag any `${{ }}` in a
        # run block as expression injection, and the indirection keeps that true
        # if this step ever reads a free-text context value.
        env:
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
        run: pnpm check:last-updated --base "$BASE_REF"

      # A sidecar is generated FROM its md, so the two drifting apart means the
      # site serves stale tokens. That is not hypothetical: wanted lost 51 colors
      # when an md edit skipped regeneration, and nothing caught it until a
      # bulk rebuild happened to surface the diff.
      - name: Check token sidecars are in sync
        run: pnpm tokens:check

      # Past-data counterpart to the oklch-hex-mismatch rule: validate:catalog
      # only judges `name: oklch(…)  # #hex` lines, while this also sweeps the
      # derived literals (aliases, gradients, alpha, preview CSS) those values
      # get copied into.
      - name: Audit OKLCH ↔ hex agreement
        run: pnpm audit:oklch

      - name: Build
        run: pnpm build

  # Separate from `build` because it needs a browser. Folding it in would widen
  # that job's failure surface — a Chromium download that 502s would read as a
  # typecheck failure — and the two answer different questions anyway. Cost is
  # not the reason either way: a full sweep is about 25 seconds.
  contrast:
    runs-on: ubuntu-latest
    steps:
      # Depth 1 is enough: unlike `build`, nothing here diffs against a base.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Ordering is load-bearing, in two ways.
      #
      # After `--with-deps`, which already pulls in fonts-liberation and
      # fonts-ipafont-gothic: installing Noto CJK afterwards is what makes
      # fontconfig prefer it for `ko`.
      #
      # Before the browser is ever launched, because the sweep blocks the font
      # CDN and the previews are Korean — so the system fallback IS the font
      # being measured. A verdict rests on the weakest LINE of a wrapped run
      # (`src/lib/contrast.ts`), so a different fallback wraps differently and
      # can put a different line in front of the judgement. Pinned explicitly so
      # a runner image that changes its default fonts does not move the numbers.
      - name: Install a Korean fallback font
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # Before the gate, always. A broken collector and a moved number are
      # different findings — "the measurement no longer works" versus "the
      # catalogue changed" — and they exit 1 and 3 so a log tells them apart.
      - name: Does the measurement still work?
        run: pnpm audit:contrast --self-check

      # Written under `.claude/cache/`, which is already gitignored: the same
      # command run locally then leaves nothing untracked behind.
      #
      # The JSON goes up as well as the report. Every reading in it carries the
      # colour pair the verdict rests on, which is what the published-colour
      # question about a `borderline` has to be answered from — and answering it
      # from a local sweep would be answering it about a different rendering
      # than the one the recorded table describes.
      - name: Contrast baseline
        run: pnpm gate:contrast --report-out .claude/cache/contrast-report.md --json-out .claude/cache/contrast-findings.json

      # Uploaded whichever way the gate went: the report carries every row that
      # is not a pass, with the colour pair beside each ratio, which is what a
      # borderline has to be read against.
      - name: Upload the contrast report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-report
          path: |
            .claude/cache/contrast-report.md
            .claude/cache/contrast-findings.json
          if-no-files-found: warn
