name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older run; a push to main never cancels
# anything. The key is the run id outside PRs, not `github.ref`: GitHub keeps
# one running and one pending run per group and replaces the pending one even
# with cancel-in-progress off, so a shared `refs/heads/main` group would drop
# the middle of three quick pushes to main — and that is the merged result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check:last-updated diffs against the merge base; a depth-1 clone
          # has no base to diff against.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 이 Node 20 을 지원 범위에서 뺐다
          # (engines: ^22.22.2 || ^24.15.0 || >=26.0.0). jsdom 은 테스트 6개 파일의
          # vitest environment 이자 preview-validator-corpus 테스트가 직접 import 하므로
          # Node 20 을 유지하면 테스트가 지원 밖 런타임에서 돈다.
          #
          # engine-strict 를 켜 두지 않아 pnpm 은 불일치를 경고만 하고 설치는 성공시킨다
          # — 즉 버전을 안 맞추면 조용히 어긋난 채로 돌아간다.
          #
          # 버전 자체는 .nvmrc 에서 읽는다. 여기에 숫자를 직접 적으면 로컬(.nvmrc)과
          # CI 가 각자 하드코딩된 값을 갖게 되어, 한쪽만 올렸을 때 이 설정이 막으려던
          # 로컬↔CI 간극이 그대로 재생산된다.
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # validate:catalog is a strict superset of the citation-only
      # validate:sources gate (frontmatter round-trip, section order,
      # OKLCH-only token values, citations). validate:sources stays available
      # as a focused local command.
      - name: Validate catalog entries
        run: pnpm validate:catalog

      - name: Validate previews
        run: pnpm validate:previews

      - name: Check last_updated freshness
        # PR: the merge base. push: the commit this push replaced — main has no
        # branch protection, so a direct push is possible, and `origin/main`
        # equals HEAD there, which would make the gate a silent no-op.
        #
        # Via `env:` rather than interpolated into `run:`. Neither value can
        # hold shell metacharacters, but static scanners flag any `${{ }}` in a
        # run block as expression injection, and the indirection keeps that true
        # if this step ever reads a free-text context value.
        env:
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD~1' }}
        run: pnpm check:last-updated --base "$BASE_REF"

      # A sidecar is generated FROM its md, so the two drifting apart means the
      # site serves stale tokens. That is not hypothetical: wanted lost 51 colors
      # when an md edit skipped regeneration, and nothing caught it until a
      # bulk rebuild happened to surface the diff.
      - name: Check token sidecars are in sync
        run: pnpm tokens:check

      # Past-data counterpart to the oklch-hex-mismatch rule: validate:catalog
      # only judges `name: oklch(…)  # #hex` lines, while this also sweeps the
      # derived literals (aliases, gradients, alpha, preview CSS) those values
      # get copied into.
      - name: Audit OKLCH ↔ hex agreement
        run: pnpm audit:oklch

      - name: Build
        env:
          VITE_SITE_URL: https://getdesign.kr
        run: pnpm build

      - name: HTTP smoke
        run: pnpm test:http

  # Separate from `build` because it needs a browser. Folding it in would widen
  # that job's failure surface — a Chromium download that 502s would read as a
  # typecheck failure — and the two answer different questions anyway. Cost is
  # not the reason.
  contrast:
    # Pinned, unlike `build`: the numbers this job records are the canonical
    # ones (ADR 0007), and an OS move changes fontconfig, freetype and the
    # default fonts all at once. `ubuntu-latest` moving would turn that into a
    # baseline drift no PR caused; pinned, it is a PR that updates the baseline
    # with it.
    runs-on: ubuntu-24.04
    # Far above a healthy run. The cap is for the apt mirror crawling, so that
    # a stalled download ends as a failure instead of running to the 6-hour
    # default.
    timeout-minutes: 15
    env:
      # The measurement font, pinned to the version and not just the name, so
      # an archive update cannot move the numbers either. This is the only place
      # the version is spelled: the cache key reads it from here, so bumping it
      # also rotates the cached .deb.
      NOTO_CJK_VERSION: "1:20230817+repack1-3"
    steps:
      # Depth 1 is enough: unlike `build`, nothing here diffs against a base.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Before the browser is ever launched, because the sweep blocks the font
      # CDN and the previews are Korean — so the system fallback IS the font
      # being measured. A verdict rests on the weakest LINE of a wrapped run
      # (`src/lib/contrast.ts`), so a different fallback wraps differently and
      # can put a different line in front of the judgement. Pinned explicitly so
      # a runner image that changes its default fonts does not move the numbers.
      #
      # Installing Noto CJK is not enough on its own. `--with-deps` also brings
      # fonts-wqy-zenhei, whose fontconfig rule claims sans-serif first, and
      # Hangul was measured in it until #473 — install order never decided it.
      # The rule written below the install is what does.
      #
      # The .deb comes from the cache, or on a miss from apt at exactly
      # NOTO_CJK_VERSION — the 61 MB download that once took 13 minutes on a
      # crawling mirror is what the cache is for. The key carries the OS read
      # off the runner itself, and there are deliberately no restore-keys: a
      # prefix match would hand a bumped version the old .deb.
      - name: Which OS is the font cached for?
        id: os
        run: . /etc/os-release && echo "release=${ID}-${VERSION_ID}" >> "$GITHUB_OUTPUT"

      - name: Restore the Korean fallback font
        id: noto-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/noto-cjk
          key: noto-cjk-${{ steps.os.outputs.release }}-${{ env.NOTO_CJK_VERSION }}

      # If the archive ever drops this version, this fails loudly — intended.
      # Move NOTO_CJK_VERSION on in a PR that lets the gate judge the new font.
      - name: Download the Korean fallback font
        if: steps.noto-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          mkdir -p ~/.cache/noto-cjk
          cd ~/.cache/noto-cjk && apt-get download "fonts-noto-cjk=$NOTO_CJK_VERSION"

      # Saved straight away rather than by the combined action's post-job hook,
      # which only saves when the whole job succeeds — a first run that ends in
      # a baseline drift would otherwise never fill the cache.
      - name: Cache the Korean fallback font
        if: steps.noto-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/noto-cjk
          key: ${{ steps.noto-cache.outputs.cache-primary-key }}

      # One install for both paths, so a miss run also proves the command a hit
      # run relies on. `dpkg -i`, not `apt-get install ./…`: apt's resolver may
      # reach for the network, and a hit must not touch the mirror at all.
      - name: Install the Korean fallback font
        run: sudo dpkg -i ~/.cache/noto-cjk/*.deb

      # A user rule (loaded by 50-user.conf) that puts Noto CJK at the very front
      # of a Korean generic-family request. `prepend_first`, because wqy-zenhei's
      # 44-*.conf has already prepended itself before `sans-serif` — a plain
      # `prepend` would land behind it. Only for `lang=ko`, so Latin text keeps
      # the fonts it was measured in.
      - name: Set Korean in Noto CJK
        run: |
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <match target="pattern">
              <test name="lang" compare="contains"><string>ko</string></test>
              <test name="family"><string>sans-serif</string></test>
              <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans CJK KR</string></edit>
            </match>
            <match target="pattern">
              <test name="lang" compare="contains"><string>ko</string></test>
              <test name="family"><string>serif</string></test>
              <edit name="family" mode="prepend_first" binding="strong"><string>Noto Serif CJK KR</string></edit>
            </match>
            <match target="pattern">
              <test name="lang" compare="contains"><string>ko</string></test>
              <test name="family"><string>monospace</string></test>
              <edit name="family" mode="prepend_first" binding="strong"><string>Noto Sans Mono CJK KR</string></edit>
            </match>
          </fontconfig>
          EOF

      # Its own step, ahead of the self-check: a cache that restored but left no
      # usable font must not surface as exit 3, "the catalogue changed".
      - name: Is Korean text set in Noto Sans CJK?
        run: |
          family="$(fc-match 'sans-serif:lang=ko' family)"
          echo "sans-serif:lang=ko resolves to: $family"
          case "$family" in
            *"Noto Sans CJK"*) ;;
            *) echo "::error::Korean sans-serif resolves to '$family', not Noto Sans CJK — the measurement font is not in place"; exit 1 ;;
          esac

      # Before the gate, always. A broken collector and a moved number are
      # different findings — "the measurement no longer works" versus "the
      # catalogue changed" — and they exit 1 and 3 so a log tells them apart.
      - name: Does the measurement still work?
        run: pnpm audit:contrast --self-check

      # Written under `.claude/cache/`, which is already gitignored: the same
      # command run locally then leaves nothing untracked behind.
      #
      # The JSON goes up as well as the report. Every reading in it carries the
      # colour pair the verdict rests on, which is what the published-colour
      # question about a `borderline` has to be answered from — and answering it
      # from a local sweep would be answering it about a different rendering
      # than the one the recorded table describes.
      - name: Contrast baseline
        run: pnpm gate:contrast --report-out .claude/cache/contrast-report.md --json-out .claude/cache/contrast-findings.json

      # TEMP (#473) — remove before merge. Which platform font Chromium really
      # drew Hangul with, loaded exactly as the sweep loads it (serveStatic over
      # loopback, everything else aborted).
      - name: "TEMP: which font did Chromium render Korean with?"
        if: always()
        continue-on-error: true
        run: |
          for q in 'sans-serif:lang=ko' 'serif:lang=ko' 'Noto Sans KR' 'Pretendard:lang=ko'; do
            echo "fc-match '$q' -> $(fc-match -f '%{family[0]}' "$q")"
          done
          mkdir -p .claude/cache
          cat > .claude/cache/font-probe.ts <<'EOF'
          import { readdirSync, existsSync } from "node:fs"
          import { join, resolve } from "node:path"
          import { chromium } from "playwright"
          import { serveStatic } from "../../scripts/audit-contrast-sweep"
          const root = resolve("public")
          const server = await serveStatic(root)
          const browser = await chromium.launch()
          const ctx = await browser.newContext({ viewport: { width: 976, height: 800 }, reducedMotion: "reduce" })
          await ctx.route("**/*", (r) => (new URL(r.request().url()).hostname === "127.0.0.1" ? r.continue() : r.abort()))
          const slugs = readdirSync(join(root, "preview")).filter((s) => existsSync(join(root, "preview", s, "preview.html"))).sort()
          const total: Record<string, number> = {}
          for (const slug of slugs) {
            const page = await ctx.newPage()
            await page.goto(`http://127.0.0.1:${server.port}/preview/${slug}/preview.html`, { waitUntil: "load" })
            await page.evaluate(`(() => {
              let k = 0
              for (const el of document.querySelectorAll("body *")) {
                if (k >= 300) break
                const own = [...el.childNodes].filter((c) => c.nodeType === 3).map((c) => c.textContent).join("")
                if (/[가-힣]/.test(own) && el.getClientRects().length) { el.setAttribute("data-font-probe", ""); k++ }
              }
            })()`)
            const cdp = await ctx.newCDPSession(page)
            await cdp.send("DOM.enable")
            await cdp.send("CSS.enable")
            const { root: doc } = await cdp.send("DOM.getDocument", { depth: -1 })
            const { nodeIds } = await cdp.send("DOM.querySelectorAll", { nodeId: doc.nodeId, selector: "[data-font-probe]" })
            const tally: Record<string, number> = {}
            for (const nodeId of nodeIds) {
              const { fonts } = await cdp.send("CSS.getPlatformFontsForNode", { nodeId })
              for (const f of fonts) {
                tally[f.familyName] = (tally[f.familyName] ?? 0) + f.glyphCount
                total[f.familyName] = (total[f.familyName] ?? 0) + f.glyphCount
              }
            }
            const summary = Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([f, c]) => `${f}=${c}`).join(", ")
            console.log(`${slug.padEnd(20)} nodes=${String(nodeIds.length).padStart(3)}  ${summary}`)
            await page.close()
          }
          console.log("TOTAL " + Object.entries(total).sort((a, b) => b[1] - a[1]).map(([f, c]) => `${f}=${c}`).join(", "))
          await browser.close()
          await server.close()
          EOF
          pnpm exec tsx .claude/cache/font-probe.ts

      # Uploaded whichever way the gate went: the report carries every row that
      # is not a pass, with the colour pair beside each ratio, which is what a
      # borderline has to be read against.
      - name: Upload the contrast report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contrast-report
          path: |
            .claude/cache/contrast-report.md
            .claude/cache/contrast-findings.json
          if-no-files-found: warn
