version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # 5는 실제로 포화됐다: 2026-08 기준 npm PR 5건이 자리를 채워 신규 업데이트가
    # 아예 열리지 못했고, 그 사이 대기 중이던 PR의 타깃 버전마저 낡았다.
    open-pull-requests-limit: 10
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      types:
        patterns:
          - "@types/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @tailwindcss/vite 는 tailwindcss 를 caret 이 아니라 정확 버전으로 의존한다
      # (4.3.3 → tailwindcss 4.3.3). 한쪽만 머지하면 트리에 tailwindcss 가 두 벌
      # 남으므로 항상 함께 움직여야 한다. 둘 다 prod 의존이라 아래 dev-dependencies
      # 그룹에는 걸리지 않고, prettier-plugin-tailwindcss 는 두 패턴 어느 쪽에도
      # 매칭되지 않아 오포획도 없다.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # @playwright/test 는 playwright 를 정확 버전으로 의존한다(1.63.0 → playwright
      # 1.63.0). 한쪽만 올리면 playwright 가 두 벌 깔리고, 대비 게이트(playwright)와
      # E2E(@playwright/test)가 서로 다른 Chromium 을 받는다. 아래 dev-dependencies
      # 그룹은 major 를 묶지 않으므로 major 에서 갈라질 수 있어 따로 묶는다.
      playwright:
        patterns:
          - "playwright"
          - "@playwright/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
