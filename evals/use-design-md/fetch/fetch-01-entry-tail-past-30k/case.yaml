schema_version: "1.1"
name: fetch-01-entry-tail-past-30k
description: "끝부분이 셸 출력 한도(30,000자) 밖에 있는 항목에서, 그 끝부분에만 있는 사실이 답에 반영되는가 — seed-design 서빙본 62,220자 중 52,517자 지점(## Known Gaps)의 'Error State 는 Deprecated'. 그 항목이 바뀌면 사실을 다시 고를 것"
tags: [fetch]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "당근 SEED 디자인 시스템으로 네트워크 오류 화면을 만들 건데, SEED 의 Error State 컴포넌트를 그대로 써도 되는지 getdesign 카탈로그 항목 기준으로 먼저 확인해줘. 코드는 아직 쓰지 마."
  max_turns: 12
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
graders:
  - name: says-error-state-is-deprecated
    type: llm
    criteria: "The final answer says that, according to the fetched catalog entry, the Error State component is deprecated / excluded from the entry and should not be used for new UI. An answer that approves using Error State as-is, or that says the entry has no information about Error State, fails."
