schema_version: "1.1"
name: should-09-seed-tokens-component-library-en
tags: [trigger, should-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "apply the SEED design system tokens to my component library — at least the colors and the radius scale"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
