schema_version: "1.1"
name: should-not-11-onboard-brand-en
description: "생산자 스킬의 일 — 영문으로 항목 추가를 요청"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "onboard Kakao Bank into the ko-design-md catalog — research their design system and write the DESIGN.md entry plus its preview"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
