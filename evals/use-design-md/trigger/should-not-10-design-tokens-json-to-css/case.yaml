schema_version: "1.1"
name: should-not-10-design-tokens-json-to-css
description: "자기 토큰 파일 변환 — 카탈로그와 무관"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "내 프로젝트에 있는 design-tokens.json 파일을 css 변수 블록으로 변환해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
