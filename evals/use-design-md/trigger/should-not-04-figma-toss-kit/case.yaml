schema_version: "1.1"
name: should-not-04-figma-toss-kit
description: "Figma 키트 사용법 — 카탈로그를 거치지 않는다"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "Figma에서 토스 디자인 키트 받아서 내 프로젝트에 적용하는 방법 알려줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
