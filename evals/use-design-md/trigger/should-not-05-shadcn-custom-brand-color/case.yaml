schema_version: "1.1"
name: should-not-05-shadcn-custom-brand-color
description: "자기 브랜드 색 테마 — 한국 브랜드 차용이 아니다"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "shadcn/ui 테마를 우리 브랜드 색으로 커스터마이즈해줘. 브랜드 메인 컬러는 #1B64DA야"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
