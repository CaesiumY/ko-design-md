schema_version: "1.1"
name: should-04-krds-public-form
tags: [trigger, should-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "KRDS 톤으로 공공서비스 느낌나게 폼 컴포넌트 스타일 잡아줘. 정부과제라 그 신뢰감 있는 톤이 필요해"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
