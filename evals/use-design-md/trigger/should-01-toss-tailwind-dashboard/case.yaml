schema_version: "1.1"
name: should-01-toss-tailwind-dashboard
tags: [trigger, should-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "내 사이드프로젝트 대시보드를 토스처럼 보이게 다시 꾸며줘. 지금 tailwind 쓰고 있어"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
