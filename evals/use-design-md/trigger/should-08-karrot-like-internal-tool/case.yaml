schema_version: "1.1"
name: should-08-karrot-like-internal-tool
tags: [trigger, should-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "우리 회사 내부 툴이 너무 밋밋한데, 한국 서비스 중에 당근 같은 친근한 디자인을 입히고 싶어. 카탈로그에서 찾아서 적용 가능?"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
