schema_version: "1.1"
name: should-not-13-dark-mode-tailwind
description: "브랜드 없는 범용 리스타일 — 다크 모드 지원"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "우리 대시보드에 다크 모드 지원 넣어줘. tailwind 쓰고 있고 시스템 설정 따라가게 해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
