schema_version: "1.1"
name: should-not-02-fix-typo-in-catalog-entry
description: "카탈로그 항목 편집 — 소비가 아니다"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "services/toss.md의 spacing 섹션에 오타 하나 있어 — 'spacng'을 'spacing'으로 고쳐줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
