schema_version: "1.1"
name: should-not-03-explain-design-md-format
description: "포맷 설명 질문 — 적용할 UI 가 없다"
tags: [trigger, should-not-trigger]
plugins: ["../../../../.claude/skills/use-design-md"]
runs: 3
execution:
  prompt: "design.md 포맷이 뭐야? Stitch v0.1이랑 일반 마크다운이랑 뭐가 다른지 설명해줘"
  max_turns: 3
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: does-not-fire
    type: tool_used
    tool: Skill
    min: 0
    max: 0
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?use-design-md"'
